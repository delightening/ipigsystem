<rect width="780" height="571" fill="#f8fafc"/>
<text x="390" y="34" text-anchor="middle" font-size="19" font-weight="700" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">圖 2 · 編輯模式：拖曳讓位 + ✕ 隱藏</text>
<rect x="180" y="60" width="420" height="50" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="390" y="90" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">① 點「編輯佈局」→ isEditMode = true</text><rect x="40" y="155" width="320" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="200" y="188" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">拖曳 / 縮放 widget</text><rect x="40" y="239" width="320" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="200" y="272" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">其他 widget 讓位（preventCollision=false）</text><rect x="40" y="323" width="320" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="200" y="356" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">handleLayoutChange 記錄 lg 座標 → pendingLayout</text><rect x="420" y="155" width="320" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="580" y="188" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">點 widget 右上角 ✕</text><rect x="420" y="239" width="320" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="580" y="272" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">handleHideWidget：visible=false（即時消失）</text><path d="M 390 110 L 200 155" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="281" y="121.5" width="28" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="295" y="135.5" text-anchor="middle" font-size="12" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#334155">拖曳</text><path d="M 390 110 L 580 155" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="463" y="121.5" width="44" height="20" rx="4" fill="#fff" stroke="#cbd5e1"/><text x="485" y="135.5" text-anchor="middle" font-size="12" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#334155">✕ 隱藏</text><path d="M 200 211 L 200 239" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 200 295 L 200 323" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 580 211 L 580 239" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="413" width="420" height="56" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="390" y="446" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">hasUnsavedChanges = true（畫面即時更新）</text><path d="M 200 379 L 390 413" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><path d="M 580 295 L 390 413" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="497" width="420" height="44" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/><text x="390" y="524" text-anchor="middle" font-size="14" font-family='-apple-system,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif' fill="#0f172a">↓ 下一步：點「儲存佈局」（見圖 3）</text><path d="M 390 469 L 390 497" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
