<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>舊計劃書匯入盤點 + 模擬匯入</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --text:#e6e9ef; --muted:#9aa3b2;
    --accent:#4f8cff; --ok:#36c08a; --warn:#caa14a; --gap:#ff6b6b; --imp:#b48cff;
    --chip:#222733;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Noto Sans CJK TC",system-ui,sans-serif;line-height:1.45;padding:22px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:12px}
  .stat b{font-size:18px;display:block;color:var(--accent)}
  .stat.gap b{color:var(--gap)} .stat.ok b{color:var(--ok)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .controls label{font-size:12px;color:var(--muted)}
  select,input[type=text]{background:#0f1218;color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:5px 8px;font-size:12.5px}
  input[type=text]{min-width:220px}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .legend{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .legend .nv{display:inline-block;margin-right:12px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  th{background:#1b1f28;position:sticky;top:0;cursor:pointer;white-space:nowrap;color:#cfd6e4;z-index:2}
  th:hover{color:#fff}
  tr.main:hover{background:#1a1e26;cursor:pointer}
  tr.detail td{background:#10131a;padding:0}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:600;white-space:nowrap}
  .nv-pre{background:#2a2310;color:var(--warn)} .nv-A{background:#16233f;color:var(--accent)}
  .nv-B{background:#10271f;color:var(--ok)} .nv-C{background:#1f1733;color:var(--imp)}
  .nv-D{background:#2a1414;color:#ff9d6b}
  .doc{font-size:13px;letter-spacing:1px}
  .y{color:var(--ok)} .n{color:#4a5060}
  .miss{color:var(--gap);font-size:11px}
  .none{color:var(--muted)}
  .rev{color:var(--imp);font-weight:600}
  .src{color:var(--imp);font-size:10px;cursor:help}
  .det{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .det h3{font-size:13px;margin:0 0 8px;color:#cfd6e4;border-bottom:1px solid var(--line);padding-bottom:4px}
  .kv{font-size:12px;margin:3px 0}
  .kv b{color:var(--muted);font-weight:400;display:inline-block;min-width:92px}
  .tl{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .tlchip{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px}
  .tlchip.ms{background:#10271f;border-color:#1c4d3a;color:#cdeede}
  .tlchip.todo{background:#2a2310;border-color:#5a4a1f;color:var(--warn)}
  pre{background:#0c0e13;border:1px solid var(--line);border-radius:7px;padding:10px;font-size:11px;
    overflow:auto;margin:6px 0 0;color:#cdd6e8;max-height:340px}
  .pl-todo{color:var(--warn)}
  .full{grid-column:1/3}
  .hint{color:var(--muted);font-size:11px;margin-top:4px}
  @media(max-width:820px){.det{grid-template-columns:1fr}.full{grid-column:1}}
</style>
</head>
<body>
  <h1>舊計劃書匯入盤點 + 模擬匯入工具</h1>
  <div class="sub">資料來源：主計畫進度表（QA-02-01-01_20260529）＋ <code>計劃書匯入\</code> 歸檔資料夾。純讀取產生，不動原檔。點任一列展開時間軸與模擬匯入 payload。</div>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <label>年度 <select id="fYear"><option value="">全部</option></select></label>
    <label>進度 <select id="fProg"><option value="">全部</option></select></label>
    <label>GLP <select id="fGlp"><option value="">全部</option></select></label>
    <span class="chk"><input type="checkbox" id="fOpen" checked><label for="fOpen">只看匯入範圍（26 筆）</label></span>
    <span class="chk"><input type="checkbox" id="fMiss"><label for="fMiss">只看有缺漏</label></span>
    <span class="chk"><input type="checkbox" id="fFolder"><label for="fFolder">只看有歸檔資料夾</label></span>
    <input type="text" id="fSearch" placeholder="搜尋：編號 / 名稱 / 單位 / PI / SD">
    <span id="count" style="font-size:12px;color:var(--muted)"></span>
  </div>

  <div class="legend">
    須知版本（依申請時間推斷）：
    <span class="nv"><span class="badge nv-pre">pre-A</span> 2018/2019版</span>
    <span class="nv"><span class="badge nv-A">A</span> 2020-12-15</span>
    <span class="nv"><span class="badge nv-B">B</span> 2023-04-12</span>
    <span class="nv"><span class="badge nv-C">C</span> 2024-11-26</span>
    <span class="nv"><span class="badge nv-D">D</span> 2025-09-15</span>
    ｜ 文件欄：申請表 · 須<small>(須知簽名)</small> · 審<small>(審查回覆)</small> · 收<small>(收件證明)</small> · 結<small>(結案)</small>
  </div>

  <table id="tbl">
    <thead><tr>
      <th data-k="no">編號 ▲</th>
      <th data-k="apig">APIG</th>
      <th data-k="rev">R</th>
      <th data-k="year">年</th>
      <th data-k="title">試驗名稱</th>
      <th data-k="org">委託單位</th>
      <th data-k="pi">PI(代表人)</th>
      <th data-k="sd">SD(主持人)</th>
      <th data-k="animal">動物</th>
      <th data-k="use_n">數量</th>
      <th data-k="open">狀態</th>
      <th data-k="progress">進度</th>
      <th data-k="notice">須知</th>
      <th>文件</th>
      <th data-k="miss">缺漏</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>

const recs = DATA.records;

// 衍生欄位
recs.forEach(r=>{
  const s=r.sheet||{}, f=r.folder||{};
  r._apig=r.apig||''; r._rev=f.rev||''; r._title=r.title||''; r._org=r.org||'';

// 統計卡
const st=DATA.stats;
const years=Object.keys(st.by_year).sort();
document.getElementById('stats').innerHTML=
  `<div class="stat"><b>${st.total}</b>計劃總筆數</div>`+

// 篩選選項
const fY=document.getElementById('fYear');
years.forEach(y=>fY.add(new Option(y+' ('+st.by_year[y]+')',y)));
const progs=[...new Set(recs.map(r=>r._prog).filter(Boolean))].sort();
const fP=document.getElementById('fProg'); progs.forEach(p=>fP.add(new Option(p,p)));
const glps=[...new Set(recs.map(r=>r._glp).filter(Boolean))].sort();
const fG=document.getElementById('fGlp'); glps.forEach(g=>fG.add(new Option(g,g)));

let sortK='no', sortAsc=true;

function nvBadge(c){ if(!c) return '<span class="none">—</span>';
  const cls={'pre-A':'nv-pre','A':'nv-A','B':'nv-B','C':'nv-C','D':'nv-D'}[c]||'';
  return `<span class="badge ${cls}">${c}</span>`; }
function doc(b){ return b?'<span class="y">✓</span>':'<span class="n">·</span>'; }

function importPayload(r){
  const s=r.sheet||{}, f=r.folder||{};
  const wc={};
  if(s.species) wc.species=s.species;
  if(s.strain) wc.strain=s.strain;
  if(s.animal_src) wc.animal_source=s.animal_src;
  if(s.use_n) wc.planned_use_count=s.use_n;
  if(s.death_method) wc.death_method=s.death_method;
  if(s.type) wc.project_type=s.type;
  if(s.kind) wc.project_kind=s.kind;
  if(s.funding) wc.funding_source=s.funding;
  if(s.subst) wc.test_substance=s.subst;
  const p={
    title: r.title||'「__待補：申請表標題__」',
    iacuc_no: r.is_apig_only?'「__待補：尚無PIG核准編號__」':r.no,
    application_no: r.apig||'「__待補：APIG__」',
    pi_name: r.pi||'「__待補__」',
    study_director: r.sd ? (r.sd+'（→需對應系統內部員工帳號）') : '「__待補：研究主持人__」',
    start_date: s.start||null,
    end_date: s.end||null,
    working_content: wc,
    submitted_at: '「__待補：5-mail收件證明__」',
    pre_review_at: '「__待補：收件證明/審查表__」',
    vet_review_at: '「__待補__」',
    committee_first_review_at: '「__待補：審查意見回覆表 v1__」',
    revision_required_at: '「__待補__」',
    committee_second_review_at: '「__待補：審查意見回覆表 v2__」',
    approved_at: '「__待補：核准日__」',
    notice_version_label: (r.notice&&r.notice.label)||'「__待補__」',
    notice_attachment: f.has_notice_sign?'2-申請須知簽名檔(掃描PDF)':'「__缺：無須知簽名檔__」',
    remark: '歷史補登匯入｜進度='+(s.progress||'')+'｜'+(s.remark||'')
  };
  return JSON.stringify(p,null,1).replace(/「__([^」]+)__」/g,'«TODO:$1»');
}

function detail(r){
  const s=r.sheet||{}, f=r.folder||{};
  // 申請表版本時間軸
  let tl='';
  (f.app_dates||[]).forEach(d=>{ const ds=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);
    tl+=`<span class="tlchip">${ds}</span>`; });
  if(!tl) tl='<span class="none">（無申請表版本日期）</span>';
  let ms='';
  if(s.start) ms+=`<span class="tlchip ms">試驗開始 ${s.start}</span>`;
  if(s.end) ms+=`<span class="tlchip ms">計畫截止 ${s.end}</span>`;
  if(s.report_signed) ms+=`<span class="tlchip ms">報告簽署 ${s.report_signed}</span>`;
  if(s.archived) ms+=`<span class="tlchip ms">歸檔 ${s.archived}</span>`;
  ms+=`<span class="tlchip todo">審查里程碑：待從 5-mail收件證明 / 3-審查意見回覆表 補</span>`;
  const miss=(r.missing||[]).length?`<div class="miss">⚠ ${r.missing.join('、')}</div>`:'<span class="y" style="font-size:11px">無缺漏</span>';
  return `<div class="det">
    <div>
      <h3>計劃資訊（進度表為主，ᴬ=申請表補）</h3>
      <div class="kv"><b>試驗名稱</b>${r.title||'<span class=miss>缺</span>'}${r.title_src==='申請表'?' <span class=src>ᴬ(申請表)</span>':''}</div>
      <div class="kv"><b>APIG</b>${r.apig||'<span class=miss>缺</span>'}</div>
      <div class="kv"><b>委託單位</b>${r.org||'<span class=miss>缺</span>'}${r.org_src==='申請表'?' <span class=src>ᴬ(申請表)</span>':''}</div>
      <div class="kv"><b>PI 代表人</b>${r.pi||'<span class=miss>缺</span>'}${r.pi_src&&r.pi_src!=='進度表'?' <span class=src>ᴬ('+r.pi_src+')</span>':''}</div>
      <div class="kv"><b>SD 主持人</b>${r.sd||'<span class=miss>缺</span>'}${r.sd_src&&r.sd_src!=='進度表'?' <span class=src>ᴬ('+r.sd_src+')</span>':''}</div>
      <div class="kv"><b>動物</b>${s.species||''} ${s.strain||''}｜來源 ${s.animal_src||'—'}</div>
      <div class="kv"><b>數量</b>計畫使用 ${s.use_n||'—'}／死亡 ${s.death_n||'—'}／存活 ${s.alive_n||'—'}</div>
      <div class="kv"><b>死亡方法</b>${s.death_method||'—'}</div>
      <div class="kv"><b>計畫類型</b>${s.type||'—'}／${s.kind||'—'}</div>
      <div class="kv"><b>經費來源</b>${s.funding||'—'}</div>
      <div class="kv"><b>GLP</b>${s.glp||'—'}｜<b style="min-width:auto">進度</b> ${s.progress||'—'}</div>
      <div class="kv"><b>須知版本</b>${nvBadge(r._notice)} <span class=hint>(依${r.notice_basis||'?'} ${r.ref_date||''} 推斷)</span></div>
      <div class="kv"><b>歸檔資料夾</b>${f.folder?('<code>'+f.folder+'</code>｜'+f.file_count+' 檔'):'<span class=miss>無</span>'}</div>
      <div class="kv"><b>缺漏</b>${miss}</div>
    </div>
    <div>
      <h3>申請/審查時間軸</h3>
      <div class="hint">申請表版本日期（檔名抽取）：</div>
      <div class="tl">${tl}</div>
      <div class="hint" style="margin-top:8px">里程碑：</div>
      <div class="tl">${ms}</div>
      <div class="hint" style="margin-top:8px">文件齊備：申請表 ${doc(f.has_app)}　須知簽名 ${doc(f.has_notice_sign)}　審查回覆 ${doc(f.has_review_reply)}　收件證明 ${doc(f.has_receipt)}　結案 ${doc(f.has_closure)}</div>
    </div>
    <div class="full">
      <h3>模擬匯入 — import-approved payload（«TODO:…» 為需人工補的欄位）</h3>
      <pre>${importPayload(r).replace(/«TODO:([^»]+)»/g,'<span class="pl-todo">«$1»</span>')}</pre>
    </div>
  </div>`;
}

function render(){
  const y=fY.value, p=fP.value, g=fG.value,
        onlyOpen=document.getElementById('fOpen').checked,
        miss=document.getElementById('fMiss').checked,
        onlyF=document.getElementById('fFolder').checked,
        q=document.getElementById('fSearch').value.trim().toLowerCase();
  let rows=recs.filter(r=>{
    if(onlyOpen&&!r._scope) return false;
    if(y&&r.year!==y) return false;
    if(p&&r._prog!==p) return false;
    if(g&&r._glp!==g) return false;
    if(miss&&r._missn===0) return false;
    if(onlyF&&!r.folder) return false;
    if(q){ const hay=(r.no+r._apig+r._title+r._org+r._pi+r._sd).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  rows.sort((a,b)=>{ let av,bv;
    if(sortK==='open'){av=a._scope?0:1;bv=b._scope?0:1;}
    else if(sortK==='miss'){av=a._missn;bv=b._missn;}
    else if(sortK==='notice'){av=a._notice;bv=b._notice;}
    else if(['apig','rev'].includes(sortK)){av=a['_'+sortK];bv=b['_'+sortK];}
    else if(['title','org','pi','sd','progress','use_n','animal'].includes(sortK)){av=a['_'+(sortK==='progress'?'prog':sortK)]||'';bv=b['_'+(sortK==='progress'?'prog':sortK)]||'';}
    else {av=a[sortK]||'';bv=b[sortK]||'';}
    if(av<bv)return sortAsc?-1:1; if(av>bv)return sortAsc?1:-1; return 0; });
  const tb=document.getElementById('tb'); tb.innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr'); tr.className='main';
    const s=r.sheet||{}, f=r.folder||{};
    const tsrc=r.title_src==='申請表'?'<span class=src title="來源:申請表">ᴬ</span>':'';
    const osrc=r.org_src==='申請表'?'<span class=src title="來源:申請表">ᴬ</span>':'';
    tr.innerHTML=`<td><b>${r.no}</b></td><td>${r._apig||'<span class=none>—</span>'}</td>
      <td>${r._rev?'<span class=rev>'+r._rev+'</span>':''}</td><td>${r.year}</td>
      <td>${(r._title||'<span class=miss>缺</span>').slice(0,38)}${(r._title||'').length>38?'…':''}${tsrc}</td>
      <td>${(r._org||'<span class=miss>缺</span>').slice(0,16)}${osrc}</td><td>${r._pi||'<span class=miss>缺</span>'}</td>
      <td>${r._sd||'<span class=miss>缺</span>'}</td>
      <td>${r._animal||'<span class=none>—</span>'}</td><td>${s.use_n||''}</td>
      <td>${r._scope?'<span class="badge nv-B">匯入</span>':'<span class="badge" style="background:#222733;color:#9aa3b2">'+(r._exreason||'結案')+'</span>'}</td>
      <td>${(s.progress||'').slice(0,8)}</td><td>${nvBadge(r._notice)}</td>
      <td class="doc">${doc(f.has_app)}${doc(f.has_notice_sign)}${doc(f.has_review_reply)}${doc(f.has_receipt)}${doc(f.has_closure)}</td>
      <td>${r._missn?'<span class=miss>'+r._missn+' 項</span>':'<span class=y>✓</span>'}</td>`;
    const dtr=document.createElement('tr'); dtr.className='detail'; dtr.style.display='none';
    dtr.innerHTML=`<td colspan="15"></td>`;
    tr.onclick=()=>{ if(dtr.style.display==='none'){ if(!dtr.dataset.loaded){dtr.firstChild.innerHTML=detail(r);dtr.dataset.loaded='1';} dtr.style.display='';} else dtr.style.display='none'; };
    tb.appendChild(tr); tb.appendChild(dtr);
  });
  document.getElementById('count').textContent=`顯示 ${rows.length} / ${recs.length} 筆`;
}

document.querySelectorAll('th[data-k]').forEach(th=>{
  th.onclick=()=>{ const k=th.dataset.k; if(sortK===k)sortAsc=!sortAsc; else{sortK=k;sortAsc=true;}
    document.querySelectorAll('th[data-k]').forEach(t=>t.textContent=t.textContent.replace(/ [▲▼]$/,''));
    th.textContent=th.textContent+(sortAsc?' ▲':' ▼'); render(); };
});
['fYear','fProg','fGlp','fSearch'].forEach(id=>document.getElementById(id).oninput=render);
['fOpen','fMiss','fFolder'].forEach(id=>document.getElementById(id).onchange=render);
render();
</script>
