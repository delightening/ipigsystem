# cargo-deny 設定檔
# 文件：https://embarkstudios.github.io/cargo-deny/
#
# 此檔案定義供應鏈安全策略：
# - advisories: 已知漏洞資料庫檢查
# - licenses: 授權條款審查
# - bans: 禁止特定 crate 或重複版本
# - sources: 允許的 crate 來源

[graph]
targets = []
all-features = true

# ============================
# 漏洞資料庫檢查
# ============================
[advisories]
# 使用 RustSec Advisory Database
# 發現已知漏洞時，CI 會失敗
# 如需暫時忽略特定漏洞，在此加入 RUSTSEC ID
yanked = "allow"  # yanked 由 transitive 引入，改 allow 避免 warn（可改以 cargo update 修復）
# 僅保留依賴樹中「實際存在」的 advisory。printpdf 0.9 已移除，其傳遞依賴
# bincode/fxhash/kuchiki/proc-macro-error 對應的 ignore（RUSTSEC-2025-0141/2025-0057/
# 2023-0019/2024-0370）連同 lettre 已修復的 RUSTSEC-2026-0141 一併清除（2026-06-24）。
ignore = [
    # rsa 時序攻擊（Marvin Attack）。由 jsonwebtoken 的 RS256 引入——
    # services/google_calendar.rs 用 RS256 簽 Google Calendar service-account JWT。
    # 無修復版本；Marvin 需攻擊者對私鑰運算具時序 oracle + 可控輸入，此處為系統
    # 自有金鑰簽系統自產 payload、對外呼叫，前提不成立 → 實務風險低。
    "RUSTSEC-2023-0071",
    # proc-macro-error2 不維護（validator_derive 0.20 transitive 引入；validator 0.20
    # 為最新、所有 0.19+ 版皆依賴它、無版本可擺脫）。build-time proc-macro、零執行期
    # 攻擊面、僅 unmaintained 標記、非漏洞。
    "RUSTSEC-2026-0173",
    # anyhow Error::downcast_mut() unsound（2026-06-30 新發布）。僅在對 anyhow::Error
    # 先 .context() 後又 .downcast_mut() 取回 context 時觸發 UB；本專案 anyhow 僅用於
    # 錯誤傳播/?，無 downcast_mut() 取回自訂 context 的用法 → 實際不受影響。無修復版本。
    "RUSTSEC-2026-0190",
    # rkyv 0.7.46 共享指標驗證不足：Rc/Arc/weak 的驗證未計入 pointer metadata，可經
    # rkyv::access / rkyv::from_bytes 取得長度被偽造的 slice 而越界讀取（修復版 0.8.17+）。
    # 本專案**不受影響且無法升級**：
    #   1. rkyv 是 rust_decimal 1.42.1 的 optional dependency，Cargo.toml 只啟用
    #      features = ["serde"]，從未啟用 rkyv。
    #   2. 實測 `cargo tree --target all -e normal,build,dev -i rkyv` → nothing to print，
    #      確認它不在任何 target / edge 的建置圖裡，根本沒被編譯。
    #      （cargo audit / deny 讀的 Cargo.lock 是 feature-agnostic，會列出未啟用的 optional dep。）
    #   3. 觸發條件是用上述 API 反序列化不可信 archive；本專案程式碼無 rkyv 任何用法。
    #   4. 無法升級：rust_decimal 1.42.1 釘 `rkyv = "^0.7"`，cargo 明確拒絕解析 0.8.17；
    #      且 1.42.1（2026-06-12）已是 crates.io 最新版，上游尚未換版。
    # 移除條件：rust_decimal 發布改用 rkyv >= 0.8.17 的版本後，升級並刪掉本條。
    "RUSTSEC-2026-0235",
]

# ============================
# 授權條款審查
# ============================
[licenses]
# 新版 cargo-deny 預設拒絕所有未列在 allow 中的授權（deny by default）
# 信心閾值
confidence-threshold = 0.8

# 允許的授權條款
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    # printpdf 0.9 的 HTML 渲染依賴（azul-*, cssparser, selectors, dtoa-short）
    "MPL-2.0",
]


# ============================
# Crate 禁止/限制規則
# ============================
[bans]
# 允許多個版本的 crate（多為 transitive，無法統一，改 allow 消除 warn）
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

# 禁止的 crate（已知有安全問題的替代品）
deny = [
    # 使用 getrandom 取代
    # { name = "rand_core", wrappers = ["rand"] },
]

# ============================
# Crate 來源限制
# ============================
[sources]
# 僅允許 crates.io
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
